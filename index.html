<!DOCTYPE html>
<html>
<head>
  <title>Milk Scanner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <h1>Milk Expiration Scanner</h1>

  <video id="video" autoplay playsinline></video>
  <br>
  <button onclick="capture()">Scan</button>

  <canvas id="canvas" style="display:none;"></canvas>
  <p id="output"></p>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <script>
    const video = document.getElementById("video");

    // 📸 Camera (mobile-safe)
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    })
    .then(stream => {
      video.srcObject = stream;
    })
    .catch(() => {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => video.srcObject = stream);
    });

    function capture() {
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      // 🎯 crop center (reduces noise a LOT)
      const w = canvas.width * 0.7;
      const h = canvas.height * 0.4;
      const x = (canvas.width - w) / 2;
      const y = (canvas.height - h) / 2;

      // 🔥 boost contrast before OCR
      ctx.filter = "contrast(200%) brightness(120%)";
      ctx.drawImage(video, x, y, w, h, 0, 0, canvas.width, canvas.height);
      ctx.filter = "none";

      const image = canvas.toDataURL("image/png");

      Tesseract.recognize(image, "eng", {
        logger: m => console.log(m)
      }).then(({ data }) => {

        const text = data.text.trim();
        const confidence = data.confidence;

        // 🧠 filter out fake detections
        if (confidence < 31 || text.length < 2) {
          document.getElementById("output").innerText =
            "No clear text found ❌";
          return;
        }

        document.getElementById("output").innerText =
          "Detected:\n" + text;
      });
    }
  </script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f5f5f5;
    }

    video {
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
    }

    button {
      font-size: 22px;
      padding: 15px 30px;
      margin-top: 20px;
      border-radius: 12px;
      border: none;
      background-color: #4CAF50;
      color: white;
    }

    p {
      margin-top: 20px;
      font-size: 18px;
      white-space: pre-wrap;
    }
  </style>

</body>
</html>
