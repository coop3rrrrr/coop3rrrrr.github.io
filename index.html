<!DOCTYPE html>
<html>
<head>
  <title>Milk Scanner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <h1>AI Milk Expiration Scanner</h1>

  <video id="video" autoplay playsinline></video>
  <div class="scanner-frame"></div>

  <br>
  <button onclick="capture()">Scan</button>

  <canvas id="canvas" style="display:none;"></canvas>
  <p id="output"></p>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <script>
    const video = document.getElementById("video");
    const frame = document.querySelector(".scanner-frame");

    let scanning = false;
    let aimScore = 0;
    let stableTime = 0;
    let autoCaptured = false;
    let ocrBusy = false;

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    })
    .then(stream => video.srcObject = stream)
    .catch(() => {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => video.srcObject = stream);
    });

    async function aimAssist() {
      if (scanning || ocrBusy || video.videoWidth === 0) {
        requestAnimationFrame(aimAssist);
        return;
      }

      ocrBusy = true;

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      const vw = video.videoWidth;
      const vh = video.videoHeight;

      const cropW = vw * 0.7;
      const cropH = vh * 0.3;

      const x = (vw - cropW) / 2;
      const y = (vh - cropH) / 2;

      canvas.width = cropW;
      canvas.height = cropH;

      ctx.drawImage(video, x, y, cropW, cropH, 0, 0, cropW, cropH);

      const image = canvas.toDataURL("image/png");

      const result = await Tesseract.recognize(image, "eng", {
        tessedit_pageseg_mode: 6
      });

      const text = result.data.text;
      const confidence = result.data.confidence;

      const hasNumbers = /\d/.test(text);
      const hasUsefulWords = /(exp|best|use|milk|date|sell)/i.test(text);
      const textAmount = text.trim().length;

      let score =
        confidence +
        (hasNumbers ? 20 : 0) +
        (hasUsefulWords ? 20 : 0) +
        (textAmount > 10 ? 10 : 0);

      if (score > 75) aimScore = Math.min(100, aimScore + 20);
      else if (score > 55) aimScore = Math.min(100, aimScore + 8);
      else aimScore = Math.max(0, aimScore - 15);

      if (aimScore > 80) stableTime++;
      else stableTime = 0;

      if (aimScore > 80) {
        frame.style.borderColor = "#00ff66";
        frame.style.boxShadow = "0 0 30px rgba(0,255,100,0.9)";

        if (stableTime > 3 && !autoCaptured) {
          autoCaptured = true;
          capture();
        }

      } else if (aimScore > 50) {
        frame.style.borderColor = "#ffcc00";
        frame.style.boxShadow = "0 0 20px rgba(255,200,0,0.5)";
      } else {
        frame.style.borderColor = "#ff3b3b";
        frame.style.boxShadow = "0 0 15px rgba(255,0,0,0.4)";
      }

      ocrBusy = false;

      setTimeout(() => requestAnimationFrame(aimAssist), 300);
    }

    aimAssist();

    function capture() {
      if (video.videoWidth === 0) return;

      scanning = true;

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      const vw = video.videoWidth;
      const vh = video.videoHeight;

      const cropW = vw * 0.7;
      const cropH = vh * 0.3;

      const x = (vw - cropW) / 2;
      const y = (vh - cropH) / 2;

      canvas.width = cropW;
      canvas.height = cropH;

      ctx.filter = "grayscale(1) contrast(180%) brightness(110%)";

      ctx.drawImage(video, x, y, cropW, cropH, 0, 0, cropW, cropH);

      ctx.filter = "none";

      const image = canvas.toDataURL("image/png");
//scan for text
      Tesseract.recognize(image, "eng", {
        tessedit_pageseg_mode: 6
      }).then(({ data }) => {
        
        const confidence = data.confidence;

        let text = data.text
          .replace(/[^a-zA-Z0-9\/\-\:\s]/g, " ")
          .replace(/\s+/g, " ")
          .trim()
          .toLowerCase();

        const hasNumbers = /\d/.test(text);
        const hasUsefulWords = /(exp|best|use|milk|date|sell|store)/i.test(text);
        const textAmount = text.trim().length;

        let score =
          confidence +
          (hasNumbers ? 20 : 0) +
          (hasUsefulWords ? 20 : 0) +
          (textAmount > 10 ? 10 : 0);

        let output = "";

        if (score > 70) {
          output = "LIKELY VALID SCAN\n\n";
        } else if (score > 45) {
          output = "UNCERTAIN SCAN\n\n";
        } else {
          output = "NO TEXT FOUND. TRY TO KEEP YOUR PHONE STABLE\n\n";
        }

        output += text;

        if (confidence < 40) {
          output += "\n\nLow confidence scan";
        }

        output += `\n\nScore: ${score}/100`;

        document.getElementById("output").innerText = output;

        scanning = false;

        setTimeout(() => {
          autoCaptured = false;
        }, 800);

        stableTime = 0;
        aimScore = 0;
      });
    }
  </script>
<!--why is there so much css-->
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f5f5f5;
    }

    video {
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
    }

    button {
      font-size: 22px;
      padding: 15px 30px;
      margin-top: 20px;
      border-radius: 12px;
      border: none;
      background-color: #4CAF50;
      color: white;
    }
    p {
      margin-top: 20px;
      font-size: 18px;
      white-space: pre-wrap;
    }

    .scanner-frame {
      position: absolute;
      top: 35%;
      left: 15%;
      width: 70%;
      height: 30%;
      border: 3px dashed rgba(255, 0, 0, 0.9);
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      transition: all 0.2s ease;
    }
  </style>
  <!--finally im free-->
</body>
</html>
