<!DOCTYPE html>
<html>
<head>
  <title>Milk Scanner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <h1>Milk Expiration Scanner</h1>

  <video id="video" autoplay playsinline></video>
  <br>
  <button onclick="capture()">Scan</button>

  <canvas id="canvas" style="display:none;"></canvas>
  <p id="output"></p>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <script>
    const video = document.getElementById("video");

    // 📸 camera
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    })
    .then(stream => {
      video.srcObject = stream;
    })
    .catch(() => {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => video.srcObject = stream);
    });

    function capture() {
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      // 🎯 crop center (less noise)
      const w = canvas.width * 0.6;
      const h = canvas.height * 0.3;
      const x = (canvas.width - w) / 2;
      const y = (canvas.height - h) / 2;

      // 🔥 enhance image
      ctx.filter = "contrast(250%) brightness(130%) grayscale(1)";
      ctx.drawImage(video, x, y, w, h, 0, 0, canvas.width, canvas.height);
      ctx.filter = "none";

      const image = canvas.toDataURL("image/png");

      Tesseract.recognize(image, "eng").then(({ data }) => {

        const cleaned = data.text
          .replace(/\n/g, " ")
          .replace(/\s+/g, " ")
          .trim();

        const confidence = data.confidence;

        let score = 0;

        if (cleaned.split(" ").length >= 2) score += 20;
        if (/[a-zA-Z]{2,}/.test(cleaned)) score += 20;
        if (/\d/.test(cleaned)) score += 10;
        if (/[A-Z]{2,}/.test(cleaned)) score += 10;
        if (confidence > 40) score += 20;
        if (/(exp|best|use|milk|date|store|keep)/i.test(cleaned)) score += 20;

        let output = "";

        if (score > 50) {
          output = "🧠 Likely real text:\n" + cleaned;
        } else {
          output = "❌ Junk / unclear text\n" + cleaned;
        }

        output += `\n\nScore: ${score}/100`;

        document.getElementById("output").innerText = output;
      });
    }
  </script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f5f5f5;
    }

    video {
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
    }

    button {
      font-size: 22px;
      padding: 15px 30px;
      margin-top: 20px;
      border-radius: 12px;
      border: none;
      background-color: #4CAF50;
      color: white;
    }

    p {
      margin-top: 20px;
      font-size: 18px;
      white-space: pre-wrap;
    }
  </style>

</body>
</html>
