<!DOCTYPE html>
<html>
<head>
  <title>Milk Scanner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <h1>AI Milk Expiration Scanner</h1>

  <div class="video-container">
    <video id="video" autoplay playsinline></video>
    <canvas id="overlay" class="overlay-canvas"></canvas>
    <div class="scanner-frame"></div>
  </div>

  <br>
  <button onclick="capture()">Scan</button>

  <canvas id="canvas" style="display:none;"></canvas>
  <p id="output"></p>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>

  <script>
    const video = document.getElementById("video");
    const frame = document.querySelector(".scanner-frame");
    const overlay = document.getElementById("overlay");

    let scanning = false;
    let aimScore = 0;
    let stableTime = 0;
    let autoCaptured = false;
    let scanBusy = false;

    function handleCameraStream(stream) {
      video.srcObject = stream;
      video.muted = true;
      video.play().catch(() => {});
    }

    function showCameraError(error) {
      document.getElementById("output").innerText = `Camera error: ${error.message || error}`;
    }

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    })
    .then(handleCameraStream)
    .catch(error => {
      return navigator.mediaDevices.getUserMedia({ video: true })
        .then(handleCameraStream)
        .catch(showCameraError);
    });

    video.addEventListener("loadedmetadata", () => {
      overlay.width = video.videoWidth;
      overlay.height = video.videoHeight;
    });

    function extractExpiryDate(text) {
      if (!text) return null;
      const normalized = text.replace(/[\.\,\s]+/g, " ").toUpperCase();
      const patterns = [
        /(?:EXP|EXPIRY|USE BY|USE-BY|BEST BEFORE|BEST-BEFORE|BB|BY)[:=\s]*([0-9]{4}[\/\-][0-9]{1,2}[\/\-][0-9]{1,2})/i,
        /(?:EXP|EXPIRY|USE BY|USE-BY|BEST BEFORE|BEST-BEFORE|BB|BY)[:=\s]*([0-9]{1,2}[\/\-][0-9]{1,2}[\/\-][0-9]{4})/i,
        /(?:EXP|EXPIRY|USE BY|USE-BY|BEST BEFORE|BEST-BEFORE|BB|BY)[:=\s]*(\d{8})/i,
        /([0-9]{4}[\/\-][0-9]{1,2}[\/\-][0-9]{1,2})/,
        /([0-9]{1,2}[\/\-][0-9]{1,2}[\/\-][0-9]{4})/,
        /(\d{8})/
      ];

      for (const pattern of patterns) {
        const match = normalized.match(pattern);
        if (match && match[1]) {
          let dateText = match[1].replace(/\s+/g, "");
          if (/^\d{8}$/.test(dateText)) {
            const yearFirst = parseInt(dateText.slice(0, 4), 10);
            if (yearFirst > 1900) {
              dateText = `${dateText.slice(0, 4)}-${dateText.slice(4, 6)}-${dateText.slice(6)}`;
            } else {
              dateText = `${dateText.slice(4, 8)}-${dateText.slice(2, 4)}-${dateText.slice(0, 2)}`;
            }
          }
          const parsed = new Date(dateText.replace(/\//g, "-"));
          if (!Number.isNaN(parsed.getTime())) {
            return parsed.toISOString().slice(0, 10);
          }
        }
      }

      try {
        let urlText = text;
        if (!/^https?:\/\//i.test(urlText)) {
          urlText = `https://${urlText}`;
        }
        const url = new URL(urlText);
        const params = ["exp", "expiry", "use_by", "use-by", "best_before", "best-before", "bb", "by", "date"];
        for (const key of params) {
          const value = url.searchParams.get(key);
          if (value) {
            const parsed = extractExpiryDate(value);
            if (parsed) return parsed;
          }
        }

        const pathMatch = url.pathname.match(/(?:exp|expiry|use-by|best-before|bb|by|date)[\/=]([0-9]{4}[\/\-][0-9]{1,2}[\/\-][0-9]{1,2}|[0-9]{1,2}[\/\-][0-9]{1,2}[\/\-][0-9]{4}|\d{8})/i);
        if (pathMatch && pathMatch[1]) {
          const parsed = extractExpiryDate(pathMatch[1]);
          if (parsed) return parsed;
        }
      } catch (error) {
        // ignore invalid URLs
      }

      return null;
    }

    function scanImageForQR(canvas) {
      const ctx = canvas.getContext("2d");
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      return jsQR(imageData.data, canvas.width, canvas.height, { inversionAttempts: "attemptBoth" });
    }

    function playTone(frequency, duration, volume = 0.5, type = "sine") {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      oscillator.type = type;
      oscillator.frequency.value = frequency;
      gain.gain.value = volume;
      oscillator.connect(gain);
      gain.connect(audioCtx.destination);
      oscillator.start();
      oscillator.stop(audioCtx.currentTime + duration / 1000);
      oscillator.onended = () => {
        if (audioCtx.state !== "closed") {
          audioCtx.close();
        }
      };
    }

    function playExpiredTone() {
      playTone(120, 500, 0.9, "square");
    }

    function playValidTone() {
      playTone(1200, 150, 0.4, "sine");
    }

    function clearOverlay() {
      if (!overlay) return;
      const ctx = overlay.getContext("2d");
      ctx.clearRect(0, 0, overlay.width, overlay.height);
    }

    function drawOverlay(bounds) {
      if (!overlay || !bounds) return;
      const ctx = overlay.getContext("2d");
      overlay.width = video.videoWidth;
      overlay.height = video.videoHeight;
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      ctx.strokeStyle = "#00ff66";
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(bounds.topLeft.x, bounds.topLeft.y);
      ctx.lineTo(bounds.topRight.x, bounds.topRight.y);
      ctx.lineTo(bounds.bottomRight.x, bounds.bottomRight.y);
      ctx.lineTo(bounds.bottomLeft.x, bounds.bottomLeft.y);
      ctx.closePath();
      ctx.stroke();
    }

    async function aimAssist() {
      if (scanning || scanBusy || video.videoWidth === 0) {
        requestAnimationFrame(aimAssist);
        return;
      }

      scanBusy = true;

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const cropSize = Math.min(vw, vh) * 0.7;
      const x = (vw - cropSize) / 2;
      const y = (vh - cropSize) / 2;

      canvas.width = cropSize;
      canvas.height = cropSize;
      ctx.drawImage(video, x, y, cropSize, cropSize, 0, 0, cropSize, cropSize);

      const qr = scanImageForQR(canvas);
      const hasQR = Boolean(qr && qr.data);

      if (hasQR && qr.location) {
        drawOverlay(qr.location);
      } else {
        clearOverlay();
      }

      if (hasQR) aimScore = Math.min(100, aimScore + 25);
      else aimScore = Math.max(0, aimScore - 20);

      if (aimScore > 80) stableTime++;
      else stableTime = 0;

      if (aimScore > 80) {
        frame.style.borderColor = "#00ff66";
        frame.style.boxShadow = "0 0 30px rgba(0,255,100,0.9)";

        if (stableTime > 2 && !autoCaptured) {
          autoCaptured = true;
          capture();
        }
      } else if (aimScore > 50) {
        frame.style.borderColor = "#ffcc00";
        frame.style.boxShadow = "0 0 20px rgba(255,200,0,0.5)";
      } else {
        frame.style.borderColor = "#ff3b3b";
        frame.style.boxShadow = "0 0 15px rgba(255,0,0,0.4)";
      }

      scanBusy = false;
      setTimeout(() => requestAnimationFrame(aimAssist), 150);
    }

    aimAssist();

    function capture() {
      if (video.videoWidth === 0) return;
      scanning = true;
      clearOverlay();

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      const vw = video.videoWidth;
      const vh = video.videoHeight;
      const cropSize = Math.min(vw, vh) * 0.7;
      const x = (vw - cropSize) / 2;
      const y = (vh - cropSize) / 2;

      canvas.width = cropSize;
      canvas.height = cropSize;
      ctx.drawImage(video, x, y, cropSize, cropSize, 0, 0, cropSize, cropSize);

      const qr = scanImageForQR(canvas);
      let output = "";

      if (qr && qr.data) {
        const payload = qr.data.trim();
        const expiry = extractExpiryDate(payload);
        output += "QR CODE DETECTED\n\n";
        output += `Decoded payload:\n${payload}\n\n`;

        if (expiry) {
          output += `Expiration date: ${expiry}`;
          const today = new Date();
          const now = new Date(today.getFullYear(), today.getMonth(), today.getDate());
          const expiryDate = new Date(expiry);
          if (expiryDate < now) {
            output += "\nSTATUS: EXPIRED";
            playExpiredTone();
          } else {
            output += "\nSTATUS: VALID";
            playValidTone();
          }
        } else {
          output += "Expiration date could not be extracted from the QR code.";
        }
      } else {
        output = "No QR code found. Please position the QR code in the frame and try again.";
      }

      document.getElementById("output").innerText = output;
      scanning = false;
      setTimeout(() => { autoCaptured = false; }, 800);
      stableTime = 0;
      aimScore = 0;
    }
  </script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f5f5f5;
    }

    video {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      object-fit: cover;
    }

    button {
      font-size: 22px;
      padding: 15px 30px;
      margin-top: 20px;
      border-radius: 12px;
      border: none;
      background-color: #4CAF50;
      color: white;
    }
    p {
      margin-top: 20px;
      font-size: 18px;
      white-space: pre-wrap;
    }

    .video-container {
      position: relative;
      display: inline-block;
      width: 100%;
      max-width: 400px;
      aspect-ratio: 1 / 1;
      overflow: hidden;
    }

    .overlay-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .scanner-frame {
      position: absolute;
      top: 15%;
      left: 15%;
      width: 70%;
      height: 70%;
      border: 3px dashed rgba(255, 0, 0, 0.9);
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      transition: all 0.2s ease;
    }
  </style>
  <!--finally im free-->
</body>
</html>
