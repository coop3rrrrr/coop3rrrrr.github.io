<!DOCTYPE html>
<html>
<head>
  <title>Milk Scanner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <h1>Milk Expiration Scanner</h1>

  <video id="video" autoplay playsinline></video>
  <br>
  <button onclick="capture()">Scan</button>

  <canvas id="canvas" style="display:none;"></canvas>
  <p id="output"></p>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <script>
    const video = document.getElementById("video");

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    })
    .then(stream => video.srcObject = stream)
    .catch(() => {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => video.srcObject = stream);
    });

    function capture() {
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      const w = canvas.width * 0.6;
      const h = canvas.height * 0.3;
      const x = (canvas.width - w) / 2;
      const y = (canvas.height - h) / 2;

      ctx.filter = "contrast(250%) brightness(130%) grayscale(1)";
      ctx.drawImage(video, x, y, w, h, 0, 0, canvas.width, canvas.height);
      ctx.filter = "none";

      const image = canvas.toDataURL("image/png");

      Tesseract.recognize(image, "eng").then(({ data }) => {
        const confidence = data.confidence;

        let text = data.text
          .replace(/[^a-zA-Z0-9\/\-\:\s]/g, " ")
          .replace(/\s+/g, " ")
          .trim()
          .toLowerCase();

        const words = text.split(" ").filter(w => w.length > 1);

        const rebuilt = [];

        for (let i = 0; i < words.length; i++) {
          let word = words[i];

          if (i < words.length - 1) {
            const combo = word + words[i + 1];
            if (/(exp|best|use|milk|date)/.test(combo)) {
              rebuilt.push(combo);
              i++;
              continue;
            }
          }

          rebuilt.push(word);
        }

        text = rebuilt.join(" ");

        let score = 0;

        if (confidence > 30) score += 20;
        if (confidence > 50) score += 20;
        if (/\d/.test(text)) score += 15;
        if (/(exp|best|use|milk|date|sell|store)/.test(text)) score += 25;
        if (text.length > 5) score += 10;

        const dateMatch = text.match(/\d{1,2}[\/\-]\d{1,2}([\/\-]\d{2,4})?/);

        if (dateMatch) score += 20;

        let output = "";

        if (score > 60) {
          output = "Likely valid text\n\n";
        } else if (score > 40) {
          output = "Unclear but usable\n\n";
        } else {
          output = "Unclear scan\n\n";
        }

        output += text;

        if (dateMatch) {
          output += "\n\nDate: " + dateMatch[0];
        }

        if (confidence < 40) {
          output += "\n\nLow confidence";
        }

        output += `\n\nScore: ${score}/100`;

        document.getElementById("output").innerText = output;
      });
    }
  </script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f5f5f5;
    }

    video {
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
    }

    button {
      font-size: 22px;
      padding: 15px 30px;
      margin-top: 20px;
      border-radius: 12px;
      border: none;
      background-color: #4CAF50;
      color: white;
    }

    p {
      margin-top: 20px;
      font-size: 18px;
      white-space: pre-wrap;
    }
  </style>

</body>
</html>
