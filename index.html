<!DOCTYPE html>
<html>
<head>
  <title>Milk Scanner</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
  <h1>AI Milk Expiration Scanner</h1>

  <video id="video" autoplay playsinline></video>
  <div class="scanner-frame"></div>

  <br>
  <button onclick="capture()">Scan</button>

  <canvas id="canvas" style="display:none;"></canvas>
  <p id="output"></p>

  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <script>
    const video = document.getElementById("video");
    const frame = document.querySelector(".scanner-frame");
    let scanning = false;

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" }
    })
    .then(stream => video.srcObject = stream)
    .catch(() => {
      navigator.mediaDevices.getUserMedia({ video: true })
        .then(stream => video.srcObject = stream);
    });

    async function aimAssist() {
      if (scanning) return;

      if (video.videoWidth === 0) {
        requestAnimationFrame(aimAssist);
        return;
      }

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      const vw = video.videoWidth;
      const vh = video.videoHeight;

      const cropW = vw * 0.7;
      const cropH = vh * 0.3;

      const x = (vw - cropW) / 2;
      const y = (vh - cropH) / 2;

      canvas.width = cropW;
      canvas.height = cropH;

      ctx.drawImage(video, x, y, cropW, cropH, 0, 0, cropW, cropH);

      const preview = canvas.toDataURL("image/png");

      const result = await Tesseract.recognize(preview, "eng", {
        tessedit_pageseg_mode: 6
      });

      const confidence = result.data.confidence;
      const textLength = result.data.text.trim().length;

      if (confidence > 55 && textLength > 5) {
        frame.style.borderColor = "#00ff66";
        frame.style.boxShadow = "0 0 20px rgba(0,255,100,0.6)";
      } else if (confidence > 30) {
        frame.style.borderColor = "#ffcc00";
        frame.style.boxShadow = "0 0 20px rgba(255,200,0,0.4)";
      } else {
        frame.style.borderColor = "#ff3b3b";
        frame.style.boxShadow = "0 0 20px rgba(255,0,0,0.4)";
      }

      requestAnimationFrame(aimAssist);
    }

    aimAssist();

    function capture() {
      if (video.videoWidth === 0) {
        alert("Camera not ready yet. Wait a sec and try again.");
        return;
      }

      scanning = true;

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      const vw = video.videoWidth;
      const vh = video.videoHeight;

      const cropW = vw * 0.7;
      const cropH = vh * 0.3;

      const x = (vw - cropW) / 2;
      const y = (vh - cropH) / 2;

      canvas.width = cropW;
      canvas.height = cropH;

      ctx.filter = "grayscale(1) contrast(180%) brightness(110%)";

      ctx.drawImage(
        video,
        x, y, cropW, cropH,
        0, 0, canvas.width, canvas.height
      );

      ctx.filter = "none";

      const image = canvas.toDataURL("image/png");

      Tesseract.recognize(image, "eng", {
        tessedit_pageseg_mode: 6
      }).then(({ data }) => {

        const confidence = data.confidence;

        let text = data.text
          .replace(/[^a-zA-Z0-9\/\-\:\s]/g, " ")
          .replace(/\s+/g, " ")
          .trim()
          .toLowerCase();

        const words = text.split(" ").filter(w => w.length > 1);

        const rebuilt = [];

        for (let i = 0; i < words.length; i++) {
          let word = words[i];

          if (i < words.length - 1) {
            const combo = word + words[i + 1];
            if (/(exp|best|use|milk|date)/.test(combo)) {
              rebuilt.push(combo);
              i++;
              continue;
            }
          }

          rebuilt.push(word);
        }

        text = rebuilt.join(" ");

        let score = 0;

        if (confidence > 30) score += 20;
        if (confidence > 50) score += 20;
        if (/\d/.test(text)) score += 15;
        if (/(exp|best|use|milk|date|sell|store)/.test(text)) score += 25;
        if (text.length > 5) score += 10;

        const dateMatch = text.match(/\d{1,2}[\/\-]\d{1,2}([\/\-]\d{2,4})?/);

        if (dateMatch) score += 20;

        let output = "";

        if (score > 60) {
          output = "Likely valid text\n\n";
        } else if (score > 40) {
          output = "Unclear but usable\n\n";
        } else {
          output = "Unclear scan\n\n";
        }

        output += text;

        if (dateMatch) {
          output += "\n\nDate: " + dateMatch[0];
        }

        if (confidence < 40) {
          output += "\n\nLow confidence";
        }

        output += `\n\nScore: ${score}/100`;

        document.getElementById("output").innerText = output;

        scanning = false;
      });
    }
  </script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #f5f5f5;
    }

    video {
      width: 100%;
      max-width: 400px;
      border-radius: 12px;
    }

    button {
      font-size: 22px;
      padding: 15px 30px;
      margin-top: 20px;
      border-radius: 12px;
      border: none;
      background-color: #4CAF50;
      color: white;
    }

    p {
      margin-top: 20px;
      font-size: 18px;
      white-space: pre-wrap;
    }

    .scanner-frame {
      position: absolute;
      top: 35%;
      left: 15%;
      width: 70%;
      height: 30%;
      border: 3px dashed rgba(255, 0, 0, 0.9);
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.45);
      pointer-events: none;
      transition: all 0.2s ease;
    }
  </style>

</body>
</html>
